  <g fill="#272D3A">
    <rect x="62" y="115" width="88" height="290" rx="24"/>
    <rect x="62" y="225" width="238" height="67" rx="24"/>
  </g>
  <!-- L: shared vertical stem + foot (teal) -->
  <g fill="#13E0A3">
    <rect x="278" y="115" width="88" height="290" rx="24"/>
    <rect x="278" y="338" width="170" height="67" rx="24"/>
  </g>
</svg>
